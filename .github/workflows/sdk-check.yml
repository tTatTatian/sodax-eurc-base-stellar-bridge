name: SODAX SDK read-only check

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - ".github/workflows/sdk-check.yml"

jobs:
  install-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install SODAX SDK
        run: npm install --no-audit --no-fund --fetch-retries=3 --fetch-timeout=120000

      - name: Run read-only SDK inspection
        run: npm run inspect:sdk
